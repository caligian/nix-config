# --- Global icon font override ---
icons_format = " <span font_family='Hack Nerd Font Propo'>{icon}</span> "

[icons]
icons = "awesome5"

[icons.overrides]
bat = ["󰂎", "󰁺", "󰁻", "󰁼", "󰁽", "󰁾", "󰁿", "󰂀", "󰂁", "󰂂", "󰁹"]
bat_charging = "󰂄"
bat_full = "󰁹"
backlight = "󰃠"

[theme]
theme = "semi-native"

[[block]]
block = "time"
interval = 5
format = " $icon $timestamp.datetime(f:'%Y-%m-%d %H:%M')"


# --- Brightness ---
[[block]]
block = "backlight"
device = "amdgpu_bl1"
format = "$icon $brightness "
step_width = 5

# --- Volume ---
[[block]]
block = "sound"
driver = "pulseaudio"
format = "$icon $volume "
step_width = 5

# --- Battery ---
[[block]]
block = "battery"
format = "$icon $percentage"
interval = 10
